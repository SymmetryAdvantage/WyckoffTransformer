# Classifier-free-guidance e_hull WyFormer on MP-20. It is uncond_adamw_wsd.yaml (same
# directory) plus the conditioning of yamls/models/lemat/der/ehull_adamw_wsd_5x_cfg.yaml
# (branch der-ehull-cfg), and nothing else:
#
#   condition_feature: e_above_hull -- MP-20's name for the column; LeMat's is
#     energy_above_hull. MP-20 holds only 0 <= e_hull < 0.08 eV/atom, so the condition has far
#     less range to steer than on LeMat-Bulk (0-37); log1p is near-linear over all of it.
#   condition_transform: log1p, condition_dropout: 0.1, condition_dim: 2 (log1p(e_hull) and
#     the null indicator) -- as in the LeMat CFG run; see docs/classifier_free_guidance.md
#     for why the indicator is 0 on conditioned rows.
#
# Width is the base MP-20 generator's, not the LeMat 5x one: 27136 training structures.
# Sample with `--guidance-scale`.
model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
    augmented:
      - site_symmetries
      - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: true
    target: NextToken
    evaluation_samples: 100
    condition_feature: e_above_hull
    condition_transform: log1p
    condition_dropout: 0.1
    compile_model: true
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: true
    aggregate_after_encoder: false
    mixer_layers: 1
    token_aggregation: null
    include_start_in_aggregation: false
    aggregation_inclsion: null
    outputs: token_scores
    num_fully_connected_layers: 3
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    condition_dim: 2
    TransformerEncoderLayer_args:
      nhead: 4
      dim_feedforward: 128
      dropout: 0.2
    TransformerEncoder_args:
      num_layers: 3
      enable_nested_tensor: false
optimisation:
  optimiser:
    name: AdamW
    config:
      lr: 0.003
      weight_decay: 0.01
      betas: [0.9, 0.999]
  scheduler:
    module: wyckoff_transformer.schedules
    name: warmup_stable_decay
    config:
      warmup_fraction: 0.002
      decay_fraction: 0.2
      final_lr_fraction: 0.0
      decay_shape: 1-sqrt
  validation_period: 1000
  early_stopping_patience_epochs: 100000000
  clip_grad_norm: 10.0
  epochs: 1000000
tokeniser:
  name: der_tokenizer_v1
evaluation:
  n_structures_to_generate: 10000
