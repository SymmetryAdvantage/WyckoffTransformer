# Unconditional WyFormer on MP-20 with the current recipe: der_tokenizer_v1, the corrected
# Wyckoff augmentation, AdamW + warmup-stable-decay. For the MP-20 benchmark tables.
#
# Architecture is the ICML 2025 MP-20 generator, yamls/models/NextToken/v6/base_sg.yaml
# (embeddings 16/16/8, 4 heads, FFN 128, 3 layers, dropout 0.2), which is also the width of
# the LeMat der generators before their 5x variants. What differs from base_sg.yaml:
#
#   tokeniser mp_20_sg_multiplicity -> der_tokenizer_v1, and model.cascade.augmented:
#     [site_symmetries, sites_enumeration] -- the two are augmented together, see
#     der_tokenizer_v1.yaml and docs/wyckoff_augmentation_audit.md.
#   SGD 0.2 + ReduceLROnPlateau -> AdamW 3e-3 + WSD, as in yamls/models/lemat/der/.
#
# Dropout stays at base_sg.yaml's 0.2, not the LeMat runs' 0: MP-20 has 27136 training
# structures against ~144k parameters, the opposite regime from LeMat-Bulk's 28 per parameter.
#
# Batch sizes are left unset, i.e. the whole split, as in every earlier MP-20 generator run,
# so one epoch is one optimiser step. 1M steps: the SGD runs on this dataset (W&B 53xhs43h,
# hx9ecapn) were still improving on validation at 1-1.5M full-batch epochs, at ~35-45 ms each.
# No early stopping, as with any WSD schedule: the gain lands in the decay.
model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
    augmented:
      - site_symmetries
      - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: true
    target: NextToken
    evaluation_samples: 100
    compile_model: true
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: true
    aggregate_after_encoder: false
    mixer_layers: 1
    token_aggregation: null
    include_start_in_aggregation: false
    aggregation_inclsion: null
    outputs: token_scores
    num_fully_connected_layers: 3
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    TransformerEncoderLayer_args:
      nhead: 4
      dim_feedforward: 128
      dropout: 0.2
    TransformerEncoder_args:
      num_layers: 3
      enable_nested_tensor: false
optimisation:
  optimiser:
    name: AdamW
    config:
      lr: 0.003
      weight_decay: 0.01
      betas: [0.9, 0.999]
  scheduler:
    module: wyckoff_transformer.schedules
    name: warmup_stable_decay
    config:
      warmup_fraction: 0.002
      decay_fraction: 0.2
      final_lr_fraction: 0.0
      decay_shape: 1-sqrt
  validation_period: 1000
  early_stopping_patience_epochs: 100000000
  clip_grad_norm: 10.0
  epochs: 1000000
tokeniser:
  name: der_tokenizer_v1
evaluation:
  n_structures_to_generate: 10000
