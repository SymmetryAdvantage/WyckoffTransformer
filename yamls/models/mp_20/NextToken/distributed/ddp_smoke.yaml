# A deliberately small model for checking multi-GPU training works on a host, not for
# results: a few minutes on two Tesla K20c. See docs/distributed_training.md.
# train_batch_size is the GLOBAL batch; it must divide by the number of ranks.
model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: true
    target: NextToken
    evaluation_samples: 2
    train_batch_size: 512
    val_batch_size: 512
    test_batch_size: 512
    compile_model: false
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: true
    aggregate_after_encoder: false
    mixer_layers: 1
    token_aggregation: null
    include_start_in_aggregation: false
    aggregation_inclsion: null
    outputs: token_scores
    num_fully_connected_layers: 2
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    TransformerEncoderLayer_args:
      nhead: 2
      dim_feedforward: 64
      dropout: 0.1
    TransformerEncoder_args:
      num_layers: 2
      enable_nested_tensor: false
optimisation:
  optimiser:
    name: AdamW
    config:
      lr: 0.001
  validation_period: 5
  early_stopping_patience_epochs: 1000
  clip_grad_norm: 2.
  epochs: 16
tokeniser:
  name: mp_20_sg_multiplicity
evaluation:
  n_structures_to_generate: 200
