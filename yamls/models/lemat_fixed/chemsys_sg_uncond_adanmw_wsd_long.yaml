# SOTA chemical-system-conditioned model for LeMat-Bulk-fixed. Train on
# lemat_bulk_fixed_fmax1_stress_ehull01.
#
# ../lemat/der/chemsys_sg_uncond_adanmw_wsd.yaml, the config of
# chemsys_sg_uncond_adanmw_wsd-20260925-030937 (val 11.26), the model the kappagen campaign
# and the Cu-Ge-Te hull map sample from. That run had NOT converged: its val loss was
# still falling at the last epoch (11.29 -> 11.27 -> 11.26 over the final 500), the same
# too-short-at-low-lr shape that got the CFG backbone and the energy regressor rescheduled.
# It ran 20000 epochs, 0.62M optimiser steps. The unconditional backbone trains on the same
# slice for 9.6M.
#
#   epochs 20000 -> 309678: unconditional_5x_ehull01_h3x_xl's horizon on the same slice, ~9.9M
#     steps at 32 per epoch. decay_fraction stays 0.2, as in that run, so the anneal is 62000
#     epochs against the source's 4000.
#   validation_period 250 -> 1645, the unconditional backbone's: ~188 points rather than 1239.
#     It also sets checkpoint_period.
#   val_batch_size 30543 -> 31099, test_batch_size 30818 -> 31327: the fixed slice's splits.
#
# Architecture is unchanged (16/16/8, 3 layers), so this run isolates the horizon. At the
# source's ~1.2 s/epoch on this slice it is roughly 100 GPU-hours. Under DDP the
# 50000-row batch is global, so the step count does not depend on the GPU count.
#
# chemsys_sg_uncond_adanmw_wsd.yaml trained on the corrected Wyckoff augmentation with der_tokenizer_v1.
# Based on the config of W&B run chemsys_sg_uncond_adanmw_wsd-20260921-220745 (lemat_bulk_fmax1_stress_ehull01):
#
#   tokeniser.name lemat_bulk_fmax1_sg_multiplicity -> der_tokenizer_v1, which augments
#     site_symmetries together with sites_enumeration (see its yaml and
#     docs/wyckoff_augmentation_audit.md).
#   model.cascade.augmented: [site_symmetries, sites_enumeration]. The reference run had no
#     such key and trained on canonical Wyckoff descriptions only.
#
# train_batch_size stays 50000: under DDP it is the global batch (docs/distributed_training.md),
# so training on 4 GPUs takes the same optimiser steps (12500 per GPU).

model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
    augmented:
      - site_symmetries
      - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: true
    target: NextToken
    evaluation_samples: 1
    chemical_system_conditioning: true
    train_batch_size: 50000
    val_batch_size: 31099
    test_batch_size: 31327
    compile_model: true
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: true
    aggregate_after_encoder: false
    mixer_layers: 1
    token_aggregation: null
    include_start_in_aggregation: false
    aggregation_inclsion: null
    outputs: token_scores
    num_fully_connected_layers: 3
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    predict_start: true
    TransformerEncoderLayer_args:
      nhead: 4
      dim_feedforward: 128
      dropout: 0.0
    TransformerEncoder_args:
      num_layers: 3
      enable_nested_tensor: false
optimisation:
  optimiser:
    name: AdamW
    config:
      lr: 0.003
      weight_decay: 0.01
      betas:
        - 0.9
        - 0.999
  scheduler:
    module: wyckoff_transformer.schedules
    name: warmup_stable_decay
    config:
      warmup_fraction: 0.002
      decay_fraction: 0.2
      final_lr_fraction: 0.0
      decay_shape: 1-sqrt
  validation_period: 1645
  early_stopping_patience_epochs: 1000000
  clip_grad_norm: 10.0
  epochs: 309678
tokeniser:
  name: der_tokenizer_v1
evaluation:
  n_structures_to_generate: 10000
