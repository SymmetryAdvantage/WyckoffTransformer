# Continued training of W&B run min_energy_adamw_wsd-20260924-102431 (min_energy_adamw_wsd.yaml,
# this directory) as its own run. Launch with
#   --train-arg --init-weights --train-arg $WYFORMER_RUNS/min_energy_adamw_wsd-20260924-102431/best_model_params.pt
# which loads its final weights; the optimiser and the WSD schedule start fresh and re-warm.
#
# Why. The reference stopped at a proof-of-concept 2859 epochs of a planned 20000
# (lemat_bulk_fmax1/gene_min_energy_adamw_wsd.yaml has the history) while still improving:
# val MAE 0.053-0.061 eV/atom through its stable phase, 0.0383 after the decay, train 0.0331.
#
#   epochs 2859 -> 17141, the rest of the planned 20000: 320 steps per epoch, so 5.5M more
#     optimiser steps. At 14.2 s/epoch on 4 A100s, ~68 h.
#   decay_fraction 0.2130 -> 0.2, the value every other der config uses; 0.2130 only aligned
#     the reference's decay with a link boundary.
#
# Everything else, architecture included, must stay identical or the weights will not load.
#
# The reference config follows, with only those two lines changed.
model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
      - multiplicity
    # der_tokenizer_v1's corrected augmentation relabels the site-symmetry symbol together
    # with the enumeration; both must be listed, and are sampled at matching indices.
    # multiplicity is a normaliser invariant, so it is not augmented.
    augmented:
      - site_symmetries
      - sites_enumeration
    embedding_size:
      elements: 40
      site_symmetries: 40
      sites_enumeration: 16
      multiplicity: 0
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: false
    target: Scalar
    target_name: gene_min_formation_energy_per_atom
    scalar_loss: mse
    evaluation_samples: 1
    train_batch_size: 12500
    val_batch_size: 12500
    test_batch_size: 12500
    compile_model: true
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: false
    aggregate_after_encoder: true
    mixer_layers: 1
    token_aggregation: weighted_mean
    aggregation_weight: 3
    include_start_in_aggregation: false
    aggregation_inclsion: aggr
    outputs: 1
    num_fully_connected_layers: 3
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    TransformerEncoderLayer_args:
      nhead: 4
      dim_feedforward: 320
      dropout: 0.0
    TransformerEncoder_args:
      num_layers: 3
      enable_nested_tensor: false
optimisation:
  optimiser:
    name: AdamW
    config:
      lr: 0.003
      weight_decay: 0.01
      betas: [0.9, 0.999]
  scheduler:
    module: wyckoff_transformer.schedules
    name: warmup_stable_decay
    config:
      warmup_fraction: 0.002
      decay_fraction: 0.2
      final_lr_fraction: 0.0
      decay_shape: 1-sqrt
  validation_period: 250
  early_stopping_patience_epochs: 1000000
  clip_grad_norm: 10.0
  epochs: 17141
tokeniser:
  name: der_tokenizer_v1
evaluation:
  n_structures_to_generate: 10000
