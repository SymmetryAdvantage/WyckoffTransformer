# chemsys_e_hull_sg_adamw_wsd with classifier-free guidance on der_tokenizer_v1.
#
# Base config: yamls/models/lemat/chemsys_e_hull_sg_adamw_wsd.yaml, the config of W&B run
# chemsys_e_hull_sg_adamw_wsd-20260916-201605 (lemat_bulk_fmax1_stress).
#
# Changes against the base config:
#   1. Classifier-free guidance: `condition_dropout: 0.1` in WyckoffTrainer_args.
#      During training, each example's conditioning (energy_above_hull + chemical system)
#      is dropped with probability 0.1, replacing it with the null condition (zeroed
#      conditioning vector plus a trailing null-indicator column). This enables sampling-time
#      guidance via `--guidance-scale W` (see docs/classifier_free_guidance.md).
#   2. Tokeniser: `tokeniser.name: der_tokenizer_v1`.
#      The replacement tokeniser with the corrected Wyckoff augmentation, relabelling
#      site_symmetries together with sites_enumeration (see docs/wyckoff_augmentation_audit.md).
#   3. Augmentation enabled: `model.cascade.augmented: [site_symmetries, sites_enumeration]`.
#      The base config had no `augmented` key and trained on canonical descriptions only.
#      With der_tokenizer_v1, both fields are augmented together.
#   4. `augmented_storage_dtype: int16`: stores the resident augmented variants in int16
#      rather than int64, halving GPU memory footprint of the dataset store so that
#      training fits comfortably in memory.
#
# train_batch_size stays 50000: under DDP across 4 GPUs, this is 12500 per GPU (global batch).

model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
    augmented:
      - site_symmetries
      - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: true
    target: NextToken
    evaluation_samples: 1
    condition_feature:
      - energy_above_hull
    condition_transform: log1p
    condition_dropout: 0.1
    chemical_system_conditioning: true
    augmented_storage_dtype: int16
    train_batch_size: 50000
    val_batch_size: 50000
    test_batch_size: 50000
    compile_model: true
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: true
    aggregate_after_encoder: false
    mixer_layers: 1
    token_aggregation: null
    include_start_in_aggregation: false
    aggregation_inclsion: null
    outputs: token_scores
    num_fully_connected_layers: 3
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    predict_start: true
    TransformerEncoderLayer_args:
      nhead: 4
      dim_feedforward: 128
      dropout: 0.0
    TransformerEncoder_args:
      num_layers: 3
      enable_nested_tensor: false
optimisation:
  optimiser:
    name: AdamW
    config:
      lr: 0.003
      weight_decay: 0.01
      betas:
        - 0.9
        - 0.999
  scheduler:
    module: wyckoff_transformer.schedules
    name: warmup_stable_decay
    config:
      warmup_fraction: 0.002
      decay_fraction: 0.2
      final_lr_fraction: 0.0
      decay_shape: 1-sqrt
  validation_period: 250
  early_stopping_patience_epochs: 1000000
  clip_grad_norm: 10.0
  epochs: 20000
tokeniser:
  name: der_tokenizer_v1
evaluation:
  n_structures_to_generate: 10000
