model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: true
    target: NextToken
    evaluation_samples: 1
    condition_feature: energy_above_hull
    # e_hull spans 0-37 eV/atom while the median is 0.235 and p99 is 2.73, so a handful of
    # outliers would otherwise set the scale of the AdaLN modulation input. log1p is near-linear
    # over the 0-0.1 band we actually sample from and compressive in the tail (37 -> 3.65).
    # The data stays in eV/atom; the transform is applied on the way into the model.
    condition_transform: log1p
    # LeMat-Bulk is ~4.2M structures, full-batch training is not an option.
    # Measured on an RTX 6000 Ada: per-step cost is dominated by kernel launches rather than
    # arithmetic for this 144k-parameter model, so throughput rises with batch size up to
    # ~25-50k (243k examples/s) and falls again by 100k, where the model finally becomes
    # compute-bound. 25k and 50k tie on throughput, so take the one with twice the optimiser
    # steps. Peak memory is 10.4 GiB, nearly all of it the resident dataset.
    train_batch_size: 25000
    val_batch_size: 25000
    test_batch_size: 25000
    compile_model: true
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: true
    aggregate_after_encoder: false
    mixer_layers: 1
    token_aggregation: null
    include_start_in_aggregation: false
    aggregation_inclsion: null
    outputs: token_scores
    num_fully_connected_layers: 3
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    condition_dim: 1
    TransformerEncoderLayer_args:
      nhead: 4
      dim_feedforward: 128
      dropout: 0.2
    TransformerEncoder_args:
      num_layers: 3
      # Nested tensors are broken in the current version of PyTorch
      # https://github.com/pytorch/pytorch/issues/97111
      # We also don't need them as we ensure that batches all have the same length in WychoffTrainer
      enable_nested_tensor: false
optimisation:
  optimiser:
    module: schedulefree
    name: SGDScheduleFree
    config:
      # The training loss is a per-example mean, so this is independent of train_batch_size.
      # Measured gradient norms are 0.07-0.51 at convergence (median 0.28) and 0.06-4.9 early,
      # which puts the steady-state step at lr*0.28 = 0.39 -- the same distance per step as the
      # lr 0.2 / clip 2 pair it replaces, where clipping bound on 100% of steps and fixed every
      # step at 0.4. Unlike that pair, the step here anneals as the gradient shrinks.
      lr: 1.4
  validation_period: 1000
  early_stopping_patience_epochs: 100000
  # A spike guard, not a step-size control: 10 is about twice the largest norm seen at any model
  # state measured, so it fires only on a genuine outlier. Optional -- omit it to train
  # unconstrained. Watch the `grad_norm` metric: if it sits at this value the threshold has
  # become the learning rate, which is how run lu4xqw0w spent 100k epochs degrading while its
  # per-known_seq_len loss weighting was silently normalised away.
  clip_grad_norm: 10.
  epochs: 1000000
tokeniser:
  name: lemat_bulk_ehull_sg_multiplicity
evaluation:
  n_structures_to_generate: 10000
