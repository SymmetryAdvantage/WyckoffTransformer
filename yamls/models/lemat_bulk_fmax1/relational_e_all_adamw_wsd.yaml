# e_all_adamw_wsd, plus crystallographic and chemical pairwise relational attention biases.
#
# The optimiser, the schedule, the conditioning and the tokeniser are the parent's,
# unchanged and for the reasons documented there -- this file is one block different, so a
# diff against `yamls/models/lemat_bulk_ehull/e_all_adamw_wsd.yaml` is the experiment.
#
# What is added is `relational_attention_bias`, from
# `docs/archive/wyckoff_backbone_improvements.md` §1 and implemented in
# `wyckoff_transformer.cascade.relational`. Attention over Wyckoff sites is isotropic
# here: there is no positional encoding over the site axis (`learned_positional_encoding_
# max_size: 0` below) and the trainer permutes the sequence every step, so every pair of
# sites enters attention alike. The bias makes the pair matter without making the
# *position* matter -- it is a function of the two sites' tokens only, so it permutes
# with them:
#
#   A_ij = Q_i . K_j / sqrt(d_k) + B_chem(e_i, e_j) + B_wyckoff(G, ss_i, ss_j)
#
# B_chem is a learned element-embedding interaction plus an MLP over three standardised,
# symmetric physical descriptors of the pair (electronegativity difference, radius
# difference, radius ratio); B_wyckoff is a free symmetric table over site-symmetry
# pairs, gated per head by the space group. Both are added to the attention logits as a
# float `attn_mask`, so nothing else about the attention -- the padding mask included --
# changes.
#
# Everything that produces the bias is zero-initialised, so at step 0 this model is
# *bit-identical* to the parent (there is a test for it,
# `test_identical_to_the_baseline_at_initialisation`). That is what makes the comparison
# an ablation rather than two different experiments, and it is also why nothing about the
# learning rate or the warmup needed revisiting: the run starts where the parent starts.
#
# Cost, measured on one A100-40GB against the parent config on the same node and dataset.
# Parameters 150,841 -> 179,281, and 26,244 of the 28,440 added are the 81x81x4
# site-symmetry table -- a lookup, zero-initialised, and weight decay keeps the pairs that
# never co-occur at zero. Uncompiled forward+backward at batch 50000, averaged over
# sequence lengths 1..10: 80.1 -> 87.7 ms per step, i.e. +9.6%. Compiled, in the pilots
# below, a steady-state epoch is ~5 s for both -- the difference is under the resolution
# of what the progress bar reports -- while the first epoch, which pays compilation,
# grows from 66 s to 104 s.
#
# The bias tensor is [batch, nhead, N+1, N+1], the same shape as the attention scores each
# of the three layers already materialises, and it is built once per forward and shared by
# all three. Both vocabulary-sized tables (92x92 elements, 81x81 site symmetries) are
# computed off the batch axis, so the MLP and the embedding product cost the same whether
# the batch is 1 or 50000.
#
# Pilots (3 epochs, `--pilot`): relational hcj90x1q, baseline bxkblgrw. They ran the whole
# path -- train, calibrate, generate, evaluate on the test split -- to completion. Their
# losses are not a result: at three epochs both models are still essentially at
# initialisation, where this one is the parent by construction.
#
# The parent's notes on the dataset and the conditioning follow, unchanged.
#
# The dirty-data run: train on everything LeMat-Bulk has short of a pathological
# relaxation, and tell the model what it is looking at rather than filtering.
#
# The dataset is `lemat_bulk_fmax1` (scripts/build_lemat_bulk_fmax.py): max_force <= 1 eV/A
# instead of the 0.02 that produced `lemat_bulk_ehull`. That cut removed 10.5% of the
# archive, and `wyckoff_transformer.formula_energy.dataset` shows what it removed was not
# noise -- it keeps 95.6% of Alexandria rows against 35.5% of the ICSD-backed ones, because
# Materials Project reports forces from a different protocol whose median is 0.028, above
# the cut. 4,509,453 training structures here against 4,007,729 there, and the half million
# extra are disproportionately the experimentally-grounded ones.
#
# Three conditioning channels, in this order, one column of the AdaLN input each. THE ORDER
# IS LOAD-BEARING: every modulation weight is tied to it, so reordering the list below
# silently repoints all of them. There is no test that can catch that after the fact, which
# is why `build_cond` assembles the vector in exactly one place.
#
#   energy_above_hull   how stable, absolutely
#   delta_e_polymorph   how stable, relative to the best polymorph of the same composition
#                       -- the thing e_hull cannot express, since from one row at 0.15 the
#                       model cannot tell the best known structure for a formula from a
#                       polymorph 0.1 above it
#   max_force           how converged the relaxation that produced the row actually was
#
# Generation then asks for (0, 0, 0): on the hull, the ground state of its formula, and
# from a converged calculation. All three are exactly representable -- log1p(0) = 0 -- so
# that target is the origin of the conditioning space rather than an extrapolation past
# the edge of the training distribution.
model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: true
    target: NextToken
    evaluation_samples: 1
    condition_feature:
      - energy_above_hull
      - delta_e_polymorph
      - max_force
    # e_hull spans 0-37 eV/atom while the median is 0.226 and p99 is 2.72, so a handful of
    # outliers would otherwise set the scale of the AdaLN modulation input. log1p is near-linear
    # over the 0-0.1 band we actually sample from and compressive in the tail (37 -> 3.65).
    # delta_e_polymorph has the same shape and the same units, and max_force is non-negative
    # by construction, so one transform serves all three.
    # The data stays in physical units; the transform is applied on the way into the model.
    condition_transform: log1p
    # max_force is not commensurable with the two energies: unscaled, log1p leaves it a
    # near-constant input (sd 0.020 against 0.317 for e_hull) and the AdaLN weight has to
    # make up two orders of magnitude. Reading it in coarser units first fixes that. This
    # is a units choice recorded in the config, not a statistic fitted to the data, so
    # nothing has to be persisted alongside the weights for generation to agree.
    #
    # 0.05, NOT the 0.01 that run wjwmgjag used and diverged on. 0.01 was picked by matching
    # medians, which is the wrong summary for a variable that is exactly zero for a quarter
    # of rows and has a long right tail: it equalised the middle and blew up the end, giving
    # max_force the WIDEST spread of the three channels -- the opposite of the intent.
    # Measured over the training set, post-transform:
    #
    #                        sd      p99    p99.9     max
    #   energy_above_hull  0.317    1.317   1.622    3.642
    #   delta_e_polymorph  0.207    0.939   1.450    1.896
    #   max_force @ 0.01   0.525    2.365   3.153    4.613   <- widest on every statistic
    #   max_force @ 0.05   0.216    1.074   1.702    3.043   <- sits between the other two
    #
    # AdaLN is Linear(cond) -> (1+gamma) scaling with no bound on gamma, so the tail of the
    # conditioning input is the tail of the modulation. At 0.01 the diverging run reached
    # |gamma| of 23 against at most 6.6 for the single-channel baseline that is stable at
    # this learning rate.
    condition_scale:
      max_force: 0.05
    # Measured on an RTX 6000 Ada: 18.60 ms per step at 25000 (t1c9ehzp, 80000 epochs in
    # 238108 s over 12.8M steps, validation included), i.e. 1.34M examples/s. Per-step cost
    # is dominated by kernel launches rather than arithmetic for this 144k-parameter model,
    # so throughput is flat from 25k to 50k and only falls off by 100k: at 50000 an epoch
    # costs the same wall-clock as at 25000 but takes half as many, larger, quieter steps.
    # Peak memory at 25000 was 10.4 GiB, nearly all of it the resident dataset, so doubling
    # the batch adds little to it.
    train_batch_size: 50000
    val_batch_size: 50000
    test_batch_size: 50000
    compile_model: true
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: true
    aggregate_after_encoder: false
    mixer_layers: 1
    token_aggregation: null
    include_start_in_aggregation: false
    aggregation_inclsion: null
    outputs: token_scores
    num_fully_connected_layers: 3
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    # The pairwise relational bias. `element_field` and `site_symmetry_field` name entries
    # of `model.cascade.order` above; the module resolves them to cascade indices and
    # reads the element vocabulary out of the tokeniser to build its (frozen, checkpointed)
    # table of physical pair descriptors.
    relational_attention_bias:
      element_field: elements
      site_symmetry_field: site_symmetries
      # The width of the element embedding whose elementwise product feeds the learned
      # chemical interaction term W_e^T (v_i * v_j). Matched to the cascade's own
      # `elements: 16` -- this is a second, independent embedding of the same vocabulary,
      # and there is no reason for it to be the wider of the two.
      element_embedding_dim: 16
      # 3 -> 32 -> nhead over the standardised pair descriptors. 32 costs 260 parameters
      # and is evaluated once over the 92x92 vocabulary per forward, never per batch
      # element, so its width is nearly free.
      chem_mlp_hidden: 32
      # Makes B_wyckoff depend on G, as the formulation requires. NOT the additive E_sg(G)
      # of the write-up: an additive term constant along j is invariant under softmax and
      # would do exactly nothing. A per-head multiplicative gate (1 + g(G)), zero-init so
      # it starts as the identity, is the cheapest form that actually reaches the logits.
      space_group_gate: true
    # One column per entry of condition_feature. The trainer derives this and refuses to
    # run if the two disagree, so it is a declaration rather than a knob.
    condition_dim: 3
    TransformerEncoderLayer_args:
      nhead: 4
      dim_feedforward: 128
      # Zero, not merely reduced: see note 1 at the top.
      dropout: 0.0
    TransformerEncoder_args:
      num_layers: 3
      # Nested tensors are broken in the current version of PyTorch
      # https://github.com/pytorch/pytorch/issues/97111
      # We also don't need them as we ensure that batches all have the same length in WychoffTrainer
      enable_nested_tensor: false
optimisation:
  optimiser:
    name: AdamW
    config:
      # Peak rate, reached at the end of warmup. 3x the 1e-3 that is standard for a small
      # transformer, on the grounds that a 50000-example batch is far quieter than the ~512
      # such defaults assume. This is the single least-established number in the file and the
      # first thing worth a short sweep -- try 1e-3 and 1e-2 over a few thousand epochs and
      # read loss.epoch.val, since the schedule makes the early curve comparable across them.
      lr: 0.003
      # AdamW decouples the decay from the gradient, so this is a true weight-norm constraint.
      # Deliberately at torch's default rather than the 0.1 used in LLM pretraining: this model
      # is underfitting, so decay is here to bound the weight-norm growth that fed the
      # averaging failure (|x| grew 2.5e-6 per step in t1c9ehzp), not to regularise.
      weight_decay: 0.01
      # Left at torch's defaults, recorded explicitly so a change is visible in a diff. The
      # 0.9/0.95 pair common in LLM pretraining exists for runs of ~1e5 steps; at 1.8M steps
      # beta2=0.999 is still a very short window.
      betas: [0.9, 0.999]
  scheduler:
    module: wyckoff_transformer.schedules
    name: warmup_stable_decay
    config:
      # total_steps is injected by the trainer as epochs * batches_per_epoch; do not set it
      # here, or it will silently disagree with the run length.
      #
      # 0.2% of 1.8M steps is ~3600 steps of warmup -- generous in absolute terms, and the
      # usual fractions (1-2%) would spend over a hundred thousand steps ramping up.
      warmup_fraction: 0.002
      # An epoch is 90 batches on this dataset, so `epochs: 20000` is 1.8M optimiser steps,
      # roughly 19 h at the measured 3.5 s/epoch. 20% of that is 360000 steps, about 4 hours.
      # The decay is where most of the improvement appears in WSD; it is not a cool-down
      # formality, so do not kill the run before it completes.
      decay_fraction: 0.2
      final_lr_fraction: 0.0
      # Hägele et al. 2024 (arXiv:2405.18392) found 1-sqrt to beat linear and cosine at equal
      # budget. It lies below linear for the whole decay: steepest right at the start, then
      # flattening towards zero, so most of the decay phase is spent at a small rate rather
      # than easing down gradually. That is the intended behaviour, not a misconfiguration.
      decay_shape: 1-sqrt
  # 250, not the 1000 the parent uses. wjwmgjag turned upward somewhere between epochs 3000
  # and 6000 and, at one validation per 1000 epochs, that was four points spread over six
  # hours before it was legible. Validation is two batches against 90 for training, so the
  # extra points are nearly free, and the run becomes cheap to abandon rather than expensive
  # to diagnose. Note this also sets checkpoint_period, which defaults to it.
  validation_period: 250
  # Above `epochs`, so it can never fire. With WSD that is deliberate: the loss is expected to
  # sit flat through the stable phase and only fall in the last 20%, which is exactly the shape
  # patience-based stopping would cut short.
  early_stopping_patience_epochs: 1000000
  # A spike guard, not a step-size control. Roughly twice the largest gradient norm seen at any
  # model state measured, so it fires only on a genuine outlier. Watch the `grad_norm` metric:
  # if it sits at this value the threshold has become the learning rate, which is how run
  # lu4xqw0w spent 100k epochs degrading while its loss weighting was silently normalised away.
  clip_grad_norm: 10.
  epochs: 20000
tokeniser:
  name: lemat_bulk_fmax1_sg_multiplicity
evaluation:
  n_structures_to_generate: 10000
