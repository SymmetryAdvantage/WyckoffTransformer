# The energy regressor for CSP mode, fitted with the censored likelihood.
#
# base_sg_energy.yaml regresses formation_energy_per_atom with an MSE, which
# estimates E[E | gene]: the average energy of the structures a Wyckoff gene can
# realise. CSP wants the other end of that distribution, min(E | gene) -- the
# best energy the gene could reach -- because the gene fixes neither the free
# coordinates nor the cell, and the reconstruction downstream gets several
# attempts at the manifold it does fix.
#
# The labels are unchanged. What changes is that they are read as upper bounds
# on the target rather than as the target, which is what they are: a dataset
# entry is one structure on the gene's manifold, not its best. See
# wyckoff_transformer.censored for the likelihood and docs/csp_mode.md for how
# the fitted model is used.
#
# Differences from base_sg_energy.yaml, and nothing else:
#   - WyckoffTrainer_args.scalar_loss
#   - CascadeTransformer_args.outputs, 1 -> 2 for the predicted excess scale
model:
  start_token: spacegroup_number
  cascade:
    order:
      - elements
      - site_symmetries
      - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  WyckoffTrainer_args:
    multiclass_next_token_with_order_permutation: false
    target: Scalar
    target_name: formation_energy_per_atom
    scalar_loss: censored
    censored_loss_args:
      # Label noise of the reference energies, in eV/atom. Also the width over which
      # the "no structure sits below the gene's minimum" boundary is smoothed, so it
      # wants to be the honest disagreement between the labels and the relaxed truth
      # rather than as small as possible.
      noise: 0.01
      # The excess above the gene's optimum is a function of its degrees of freedom,
      # so it is predicted per gene rather than shared. Set false to learn one global
      # scale instead, and drop outputs back to 1.
      predict_scale: true
    evaluation_samples: 1
  CascadeTransformer_args:
    start_type: one_hot
    perceptron_shape: pyramid
    concat_token_counts: false
    concat_token_presence: false
    aggregate_after_encoder: true
    mixer_layers: 1
    token_aggregation: mean
    include_start_in_aggregation: true
    aggregation_inclsion: aggr
    # [location, log_scale]: the estimate of min(E | gene) and of how far above it
    # this gene's structures scatter.
    outputs: 2
    num_fully_connected_layers: 3
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    TransformerEncoderLayer_args:
      nhead: 4
      dim_feedforward: 128
      dropout: 0.2
    TransformerEncoder_args:
      num_layers: 3
      # Nested tensors are broken in the current version of PyTorch
      # https://github.com/pytorch/pytorch/issues/97111
      # We also don't need them as we ensure that batches all have the same length in WychoffTrainer
      enable_nested_tensor: false
optimisation:
  optimiser:
    name: SGD
    config:
      lr: 0.2
  scheduler:
    name: ReduceLROnPlateau
    config:
      factor: 0.8
      # note that scheduler is called every validation_period epochs
      patience: 20
  validation_period: 2000
  early_stopping_patience_epochs: 100000
  clip_grad_norm: 2.
  epochs: 150000
tokeniser:
  name: mp_20_sg_multiplicity_scalars
evaluation:
  n_structures_to_generate: 10000
