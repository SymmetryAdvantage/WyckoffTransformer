# Formula-conditioned CSP; unconditional means energy conditioning.
# Selected 2026-10-16 from W&B recipe uncond_adamw_wsd-20260925-035205:
# https://wandb.ai/symmetry-advantage/WyckoffTransformer/runs/uncond_adamw_wsd-20260925-035205
# Variant (2026-10-21): the cell size is a conditioning input, otherwise identical to
# unconditional_adamw_wsd.yaml; trained as csp-cell-hera-20261021-mp20_unconditional_cell.
# The channel holds the *conventional* cell's atom count, which also reveals the lattice
# centring: more than the DiffCSP CSP protocol gives, which is the stored (primitive) cell.
# A frequency lookup of MP-20 space groups gains 11.5 points top-1 from the primitive atom
# count and more from the conventional one (DiffCSPNew docs/ideas/csp-atom-count-leakage-paper.md).
# Read results from this model as "conventional cell given", an upper bound.
# Formation energy is the row label, not a gene minimum; no log1p on signed energies.
# Global batch is split over two GPUs. Preserve train/val/test splits.
model:
  cascade:
    order:
    - elements
    - site_symmetries
    - sites_enumeration
    augmented:
    - site_symmetries
    - sites_enumeration
    is_target:
      elements: true
      site_symmetries: true
      sites_enumeration: true
    embedding_size:
      elements: 16
      site_symmetries: 16
      sites_enumeration: 8
  start_token: spacegroup_number
  WyckoffTrainer_args:
    target: NextToken
    compile_model: true
    evaluation_samples: 100
    multiclass_next_token_with_order_permutation: true
    composition_conditioning: true
    condition_on_cell_size: true
    train_batch_size: 27136
    augmented_storage_dtype: int16
    # Gene-level CSP match rate on MP-20 val, logged as csp.val.* (added 2026-10-21, after
    # csp-cell-hera-20261021-mp20_unconditional_cell trained). The channel holds the conventional
    # atom count, so the evaluation gives that count too. See src/wyckoff_transformer/csp_validation.py.
    csp_evaluation:
      period: 10000
      n_structures: 256
      samples: 20
      cell_count: conventional
  CascadeTransformer_args:
    outputs: token_scores
    start_type: one_hot
    mixer_layers: 1
    perceptron_shape: pyramid
    token_aggregation: null
    concat_token_counts: false
    aggregation_inclsion: null
    concat_token_presence: true
    TransformerEncoder_args:
      num_layers: 3
      enable_nested_tensor: false
    aggregate_after_encoder: false
    num_fully_connected_layers: 3
    TransformerEncoderLayer_args:
      nhead: 4
      dropout: 0.2
      dim_feedforward: 128
    include_start_in_aggregation: false
    learned_positional_encoding_max_size: 0
    learned_positional_encoding_only_masked: true
    predict_start: true
optimisation:
  epochs: 1000000
  optimiser:
    name: AdamW
    config:
      lr: 0.003
      betas:
      - 0.9
      - 0.999
      weight_decay: 0.01
  scheduler:
    name: warmup_stable_decay
    config:
      decay_shape: 1-sqrt
      decay_fraction: 0.2
      warmup_fraction: 0.002
      final_lr_fraction: 0
    module: wyckoff_transformer.schedules
  clip_grad_norm: 10
  validation_period: 1000
  early_stopping_patience_epochs: 100000000
  checkpoint_period: 1000
tokeniser:
  name: der_tokenizer_v1
evaluation:
  n_structures_to_generate: 0
