# For the code to work, must be the same as the file name
obsolete: >-
  Declares harmonic_site_symmetries and/or harmonic_cluster. Both were removed,
  together with the spherical-harmonic signature they were derived from: no current
  configuration used them and they cost 764 KB of package data between them, plus
  engineers/sites_enumeration.json, the cluster-to-enumeration inverse that only
  harmonic_cluster decoding read. Models trained with this configuration keep
  loading, from the engineers stored in their own run directory; they cannot be
  retrained without restoring the builder.
name: sg_multiplicity_letter_energy_band_gap_harmonic
# uint8 doesn't fit pure_sequence_length
# uint16 fails with
# AttributeError: type object 'torch.storage.UntypedStorage' has no attribute 'dtype'. Did you mean: 'type'?
# int16 fails with CUDA memory error
dtype: uint8
# pure_sequence_length_dtype: int16
include_stop: false
token_fields:
  pure_categorical:
    - wyckoff_letters
    - site_symmetries
    - elements
    - sites_enumeration
  engineered:
    multiplicity:
      type: map
      inputs:
      - spacegroup_number
      - site_symmetries
      - sites_enumeration
    harmonic_site_symmetries:
      dtype: float32
      type: map
      inputs:
      - spacegroup_number
      - site_symmetries
      - sites_enumeration
sequence_fields:
  space_group:
    - spacegroup_number
  no_processing:
    - formation_energy_per_atom
    - band_gap
