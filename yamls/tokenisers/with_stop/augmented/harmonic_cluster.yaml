# For the code to work, must be the same as the file name
obsolete: >-
  The augmentation pairs each site's unrelabelled oriented site-symmetry symbol
  with its relabelled enumeration index. In 26 orthorhombic space groups a
  relabelling changes the symbol, so the pair names a third Wyckoff position --
  the model is shown it as an equivalent description of the one it was given.
  Kept because models were trained with it and must keep loading; use
  der_tokenizer_v1 for new work. See docs/wyckoff_augmentation_audit.md.
  It also declares harmonic_site_symmetries and harmonic_cluster, both removed as
  unused along with the spherical-harmonic signature they came from.
name: with_stop/augmented/harmonic_cluster
# uint8 doesn't fit pure_sequence_length
# uint16 fails with
# AttributeError: type object 'torch.storage.UntypedStorage' has no attribute 'dtype'. Did you mean: 'type'?
# int16 fails with CUDA memory error
dtype: uint8
pure_sequence_length_dtype: int16
include_stop: true
token_fields:
  pure_categorical:
    - wyckoff_letters
    - site_symmetries
    - elements
    - sites_enumeration
  engineered:
    multiplicity:
      type: map
      inputs:
      - spacegroup_number
      - site_symmetries
      - sites_enumeration
    harmonic_site_symmetries:
      dtype: float32
      type: map
      inputs:
      - spacegroup_number
      - site_symmetries
      - sites_enumeration
    harmonic_cluster:
      type: map
      inputs:
      - spacegroup_number
      - site_symmetries
      - sites_enumeration
  augmented_engineered:
    harmonic_site_symmetries:
      augmented_input: sites_enumeration
    harmonic_cluster:
      augmented_input: sites_enumeration
augmented_token_fields:
  - sites_enumeration
sequence_fields:
  space_group:
    - spacegroup_number