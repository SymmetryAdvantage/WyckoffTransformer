[project]
name = "wyckoff-transformer"
version = "1.0.7"
description = "Wyckoff Transformer is a machine learning model for generating crystal structures which are symmetric by design."
authors = [{ name = "Nikita Kazeev", email = "kazeevn@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12, <3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "pandas >=2.1.1",
  "numpy >=2",
  "wandb >=0.25.0",
  "scikit-learn >=1.5.0",
  "omegaconf >=2.3.0",
  "smact >=2.5.5",
  "wrapt-timeout-decorator >=1.5.1",
  "torch >=2.10.0",
  "pandarallel >=1.6.5",
  "schedulefree >=1.4.1",
  "ipympl >=0.9.7",
  "pymatgen >=2025.10.7",
  "monty >=2025.3.3",
  "pyxtal ==1.1.5",
  "pydantic >=2.12.5",
  "huggingface-hub>=1.7.2",
  # matminer 0.8.0 (Aug 2023) does `from scipy.special import sph_harm`, removed in
  # scipy 1.17, and imports the private `pymatgen.core.periodic_table._pt_data`,
  # renamed since. 0.10.1 fixes both. Its own `pandas<3` is what an unconstrained
  # resolve trades away: it takes pandas 3 and backtracks matminer to 0.8.0
  # instead, so every fresh-resolving platform silently loses the evaluation
  # metrics and the Magpie baselines. Nothing here needs pandas 3.
  "matminer >=0.10.1",
  "safetensors>=0.7.0",
  "datasets>=4.8.5",
  "pyarrow>=24.0.0",
  "fsspec>=2026.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.urls]
Homepage = "https://github.com/SymmetryAdvantage/WyckoffTransformer"
Issues = "https://github.com/SymmetryAdvantage/WyckoffTransformer/issues"

[project.scripts]
wyformer-generate = "wyckoff_transformer.cli.generate:main"
wyformer-cryspr   = "wyckoff_transformer.cli.relax:main"
wyformer-protocol = "wyckoff_transformer.cli.protocol:main"
wyformer-protocol-wandb = "wyckoff_transformer.cli.protocol_wandb:main"
wyformer-csp      = "wyckoff_transformer.cli.csp:main"
wyformer-screen   = "wyckoff_transformer.cli.screen:main"
wyformer-gene-screen = "wyckoff_transformer.cli.gene_screen:main"
wyformer-dft-screen = "wyckoff_transformer.cli.dft_screen:main"
wyformer-gene-novelty = "wyckoff_transformer.cli.gene_novelty:main"
wyformer-hull-energies = "wyckoff_transformer.formula_energy.hull_table:main"
wyformer-system-prior = "wyckoff_transformer.cli.system_prior:main"

[project.optional-dependencies]
dev = ["pytest >=9.0.2", "ruff >=0.15.0"]
publish = ["build", "twine", "packaging >=25"]
research = ["ase", "matbench-discovery", "ipykernel", "ipywidgets", "jupyter", "ipympl"]
# orb-models pins the ORB v3 weights by a date-stamped URL literal in its own
# source, identically from 0.5.1 through 0.7.0, so the floor is enough to fix
# the checkpoint that LeMat-Bulk's orb_conserv_inf hull was built with.
relax = ["mace-torch >=0.3", "ase >=3.23", "orb-models >=0.5.1"]
# NEP89 (arXiv:2504.21286), the cheap pre-relaxation potential behind
# `--prerelax-mlip nep89` and `--stage prescreen`. calorine builds a pybind11
# extension from an sdist -- there are no wheels -- so this extra needs a C++
# compiler, and it declares `numpy<=2.3` while this project runs on 2.5. That
# pin is spurious: `_nepy` touches no numpy C API, and CPUNEP is verified
# working here at numpy 2.5.3 (energies, forces and stress). A `uv sync
# --extra nep` will nonetheless *downgrade* numpy to satisfy it, so on a host
# whose numpy matters install it additively instead:
#     uv pip install --no-deps calorine
# every runtime dependency it then needs (ase, numpy, pandas, scikit-learn,
# matplotlib) is already in this project. See docs/platforms/zeus/environment.md.
nep = ["calorine >=3.5"]
cuequivariance-cu13 = ["cuequivariance-torch >=0.9", "triton >=3", "cuequivariance-ops-torch-cu13 >=0.9"]
mp = [
    "mp-api>=0.46.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wyckoff_transformer"]

# The Wyckoff mappings and engineers are committed package data, not generated at build
# time: a model is only meaningful against the exact tables it was trained with, and a
# rebuild must not be able to change them. tests/test_package_data.py holds them fixed.
[tool.hatch.build]
ignore-vcs = true
include = [
  "src/wyckoff_transformer/**/*.py",
  "scripts/**/*.py",
  "yamls/**/*",
  "src/wyckoff_transformer/wyckoffs_enumerated_by_ss.json",
  "src/wyckoff_transformer/engineers/*.json",
]

[tool.uv.sources]
# Test oracle only; see the genbench-oracle dependency group.
material-hasher = { git = "https://github.com/LeMaterial/material-hasher.git" }

[tool.pytest.ini_options]
testpaths = ["src"]
# Slow tests are opt-in: run them with `pytest -m slow`, which overrides this.
addopts = ["-m", "not slow"]
markers = [
  "needs_cache: mark test as requiring the cache file data.pkl.gz",
  "needs_relax: mark test as requiring network access and a MACE model (pass --run-relax)",
  "slow: long-running diagnostic, not run by default (select with -m slow)",
]
filterwarnings = [
  "ignore:`torch\\.jit\\.script` is deprecated\\..*:DeprecationWarning:torch\\.jit\\._script",
]

[dependency-groups]
# Oracles for tests/test_genbench_equivalence.py, which diffs our validity and
# hull-energy implementations against the originals. Never imported at
# runtime, and a dependency group rather than an optional-dependency extra
# because neither package is on PyPI and PyPI rejects direct URL references in
# published metadata. Install with: uv sync --group genbench-oracle
genbench-oracle = [
  "material-hasher",
  "func-timeout >=4.3.5",
]
